name: trail_queue
description: Trail Queue — open-source trail stewardship platform
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  geolocator: ^13.0.2
  intl: ^0.19.0
  firebase_core: ^3.12.1
  trail_queue_models:
    path: ../../packages/models
  trail_queue_api:
    path: ../../packages/api
  trail_queue_ui:
    path: ../../packages/ui
  trail_queue_map:
    path: ../../packages/map

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
